<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffde6" />
      <stop offset="25%" stop-color="#fde047" />
      <stop offset="60%" stop-color="#e5a823" />
      <stop offset="100%" stop-color="#b47a06" />
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4f4f5" />
      <stop offset="50%" stop-color="#a1a1aa" />
      <stop offset="100%" stop-color="#52525b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#e5a823" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" stroke="#27272a" stroke-width="3" />
  
  <!-- Subtle inner carbon border -->
  <rect x="8" y="8" width="176" height="176" rx="36" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Center N and B Graphic / Motorsport Wrench Icon -->
  <g transform="translate(96, 88)" filter="url(#shadow)">
    <!-- Slanted Racing Badge Motif -->
    <path d="M-36,-26 L22,-26 L36,-10 L-22,-10 Z" fill="url(#silverGrad)" />
    <path d="M-22,-6 L36,-6 L22,10 L-36,10 Z" fill="url(#goldGrad)" />
    
    <!-- Central Turbo / Wrench Graphic -->
    <circle cx="0" cy="2" r="16" fill="#09090b" stroke="url(#goldGrad)" stroke-width="3.5" />
    <circle cx="0" cy="2" r="7" fill="url(#goldGrad)" />
  </g>

  <!-- Bottom Brand Text -->
  <text x="96" y="148" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-style="italic" font-size="16" fill="#ffffff" letter-spacing="1">
    NORTH<tspan fill="#e5a823">BROS</tspan>
  </text>
  <text x="96" y="166" text-anchor="middle" font-family="monospace" font-weight="700" font-size="9" fill="#a1a1aa" letter-spacing="3">
    GARAGE
  </text>
</svg>
